apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixum-operator
  namespace: mixumos
  labels:
    app.kubernetes.io/name: mixum-operator
    app.kubernetes.io/part-of: mixumos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mixum-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mixum-operator
    spec:
      serviceAccountName: mixum-operator
      containers:
        - name: operator
          # 构建见 cloud/operator/(cargo build --release);产物亦入 mixum 仓库包
          image: ghcr.io/mixumos/mixum-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
