apiVersion: v1
kind: ServiceAccount
metadata:
  name: mixum-operator
  namespace: mixumos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mixum-operator
  namespace: mixumos
rules:
  - apiGroups: ["mixumos.io"]
    resources: ["mixumtasks"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["mixumos.io"]
    resources: ["mixumtasks/status", "mixumtasks/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mixum-operator
  namespace: mixumos
subjects:
  - kind: ServiceAccount
    name: mixum-operator
    namespace: mixumos
roleRef:
  kind: Role
  name: mixum-operator
  apiGroup: rbac.authorization.k8s.io
