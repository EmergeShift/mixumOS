# mixumOS CI:Rust 全量 + Windows 平台边界 + console 构建 + mixcomp 容器编译。
# 平台边界:mixum-agentd 依赖 nix crate(Unix-only),Windows 上只验证
# protocol/snapshot(见 docs/architecture.md「Rust 实现记录」)。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: clippy (-D warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --workspace

  rust-windows:
    # 平台边界守护:mixum-agentd 不支持 Windows(待 nix 依赖移除后再扩);
    # protocol/snapshot 有 cfg(windows) 守卫,必须保持可编译可测。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: test (protocol + snapshot)
        working-directory: rust
        run: cargo test -p mixum-protocol -p mixum-snapshot

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: install
        working-directory: console
        run: npm ci
      - name: build (tsc --noEmit && vite build)
        working-directory: console
        run: npm run build

  mixcomp:
    # 与 e2e 镜像同款 alpine 工具链,守 mixcomp 的 wlroots 0.18 编译健康。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build mixcomp in alpine (wlroots 0.18 toolchain)
        run: |
          docker run --rm -v "$PWD/mixcomp:/src" -w /src alpine:3.21 sh -c '
            apk add --no-cache make build-base pkgconf wlroots-dev json-c-dev \
              libxkbcommon-dev libjpeg-turbo-dev libpng-dev wayland-protocols &&
            make'
