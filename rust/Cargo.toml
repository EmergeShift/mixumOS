[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mixumos/mixumos"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"
thiserror = "1"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zstd = "0.13"
sled = "0.34"
