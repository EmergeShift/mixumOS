[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mixumos/mixumos"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
http = "1"
url = "2"
sha2 = "0.10"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["connect", "rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
nix = { version = "0.29", features = ["signal", "process", "hostname"] }
tempfile = "3"
aes-gcm = "0.10"
hkdf = "0.12"
sled = "0.34"
zstd = "0.13"

