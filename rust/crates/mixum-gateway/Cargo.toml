[package]
name = "mixum-gateway"
description = "mixumOS 云端枢纽:多节点信封路由、令牌签发(设计见 docs/gateway.md M1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mixum-gateway"
path = "src/bin/mixum-gateway.rs"

[dependencies]
mixum-protocol = { path = "../mixum-protocol" }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
kube = { version = "0.97", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
chrono = "0.4"
