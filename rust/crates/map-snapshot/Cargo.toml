[package]
name = "map-snapshot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MAP .mart snapshots: vendored from Mixum-Agent-Protocol (Apache-2.0)"
repository = "https://github.com/EmergeShift/Mixum-Agent-Protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
walkdir = "2"
memmap2 = "0.9"
libc = "0.2"
rkyv = { version = "0.7", features = ["alloc", "validation"] }

[dev-dependencies]
tempfile = "3"
